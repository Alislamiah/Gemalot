<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - Gemalot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#0b0f19;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}
.bg{position:fixed;inset:0;background:
  radial-gradient(circle at 15% 20%,rgba(250,204,21,.25),transparent 35%),
  radial-gradient(circle at 85% 25%,rgba(249,115,22,.2),transparent 30%),
  radial-gradient(circle at 50% 80%,rgba(34,197,94,.15),transparent 40%),
  #0b0f19;z-index:0}

.container{position:relative;z-index:1;width:92%;max-width:400px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:40px 30px;backdrop-filter:blur(20px);box-shadow:0 25px 50px rgba(0,0,0,.45);text-align:center}

.logo{width:75px;height:75px;margin:0 auto 20px;border-radius:20px;background:linear-gradient(135deg,#facc15,#f97316,#22c55e,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;box-shadow:0 8px 25px rgba(250,204,21,.35);color:#111}
h1{font-size:24px;margin-bottom:6px}
.subtitle{color:#9ca3af;font-size:14px;margin-bottom:28px}

.input-group{margin-bottom:16px;text-align:right}
.input-group label{display:block;font-size:13px;color:#a0b8d8;margin-bottom:6px}
.input-group input{width:100%;padding:14px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:15px;outline:none}
.input-group input:focus{border-color:#facc15;box-shadow:0 0 0 3px rgba(250,204,21,.15)}

.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#facc15,#f97316,#22c55e);color:#111;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
.btn:hover{opacity:.95}

.btn-alt{width:100%;padding:13px;border:1.5px solid rgba(255,255,255,.2);border-radius:12px;background:transparent;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px}
.btn-alt:hover{background:rgba(255,255,255,.06)}

.message{margin-top:14px;font-size:14px;min-height:20px}
.message.error{color:#ff6b6b}
.message.success{color:#4ade80}

.links{margin-top:22px;font-size:14px;color:#9ca3af}
.links a{color:#facc15;text-decoration:none;font-weight:600}
.divider{margin:18px 0;color:#6b7280;font-size:13px;position:relative}
.divider::before,.divider::after{content:"";position:absolute;top:50%;width:40%;height:1px;background:rgba(255,255,255,.12)}
.divider::before{right:0}
.divider::after{left:0}

/* نافذة حفظ كلمة المرور الخاصة بأداة Alislamiah */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:100}
.modal-overlay.show{display:flex}
.modal{background:#12182b;border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:28px;width:90%;max-width:360px;text-align:center}
.modal h3{margin-bottom:10px;font-size:18px}
.modal p{color:#9fb8e0;font-size:14px;margin-bottom:22px;line-height:1.5}
.modal-btns{display:flex;gap:12px}
.modal-btns button{flex:1;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.btn-yes{background:linear-gradient(135deg,#facc15,#f97316);color:#111}
.btn-no{background:rgba(255,255,255,.1);color:#ccc}
</style>
</head>
<body>
<div class="bg"></div>

<div class="container">
  <div class="logo">G</div>
  <h1>تسجيل الدخول</h1>
  <p class="subtitle">مرحباً بك مجدداً في Gemalot</p>

  <div class="input-group">
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="example@email.com">
  </div>

  <div class="input-group">
    <label>كلمة المرور</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>

  <button class="btn" id="loginBtn">دخول</button>

  <div class="divider">أو</div>

  <button class="btn-alt" id="alislamiahBtn">
    Sign in with Alislamiah AI
  </button>

  <div class="message" id="msg"></div>

  <div class="links">
    ليس لديك حساب؟ <a href="signup.html">إنشاء حساب جديد</a>
  </div>
</div>

<!-- نافذة سؤال الحفظ في Alislamiah Password Manager -->
<div class="modal-overlay" id="saveModal">
  <div class="modal">
    <h3>حفظ في Alislamiah Password Manager 🔑</h3>
    <p>هل تريد حفظ هذه البيانات لتظهر في أداة كلمات المرور الخاصة بـ Alislamiah AI؟</p>
    <div class="modal-btns">
      <button class="btn-yes" id="saveYesBtn">نعم، احفظها</button>
      <button class="btn-no" id="saveNoBtn">لا</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA6kCIokLcdCexAtrfMQAoX0xkjEFv6ANM",
    authDomain: "gemalot-1de7e.firebaseapp.com",
    projectId: "gemalot-1de7e",
    storageBucket: "gemalot-1de7e.firebasestorage.app",
    messagingSenderId: "301881533004",
    appId: "1:301881533004:web:6fd2475613ce909bf20ae9",
    measurementId: "G-RZFRH7NDCD"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  let tempData = null;

  function setCurrentUser(u) {
    localStorage.setItem("alislamiah_current_user", JSON.stringify(u));
  }

  onAuthStateChanged(auth, (user) => {
    if (user) {
      setCurrentUser({
        id: user.uid,
        name: user.displayName || user.email.split('@')[0],
        email: user.email
      });
    }
  });

  async function login() {
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    msg.textContent = "";
    msg.className = "message";

    if (!email || !password) {
      msg.className = "message error";
      msg.textContent = "يرجى إدخال البريد وكلمة المرور";
      return;
    }

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;
      const name = user.displayName || email.split('@')[0];

      setCurrentUser({
        id: user.uid,
        name: name,
        email: user.email
      });

      tempData = { name, email: user.email, password };
      document.getElementById("saveModal").classList.add("show");

    } catch (error) {
      msg.className = "message error";
      msg.textContent = "البريد أو كلمة المرور غير صحيحة";
    }
  }

  function saveYes() {
    if (!tempData) return;

    let saved = JSON.parse(localStorage.getItem("alislamiah_saved_passwords") || "[]");
    
    // التحقق بناءً على البريد واسم الموقع لعدم التكرار
    const existsIndex = saved.findIndex(s => s.email === tempData.email && s.site === "Gemalot");

    const entry = {
      id: Date.now(),
      name: tempData.name,
      email: tempData.email,
      password: tempData.password,
      site: "Gemalot",
      savedAt: new Date().toISOString()
    };

    if (existsIndex >= 0) {
      saved[existsIndex] = entry;
    } else {
      saved.unshift(entry);
    }

    localStorage.setItem("alislamiah_saved_passwords", JSON.stringify(saved));

    document.getElementById("saveModal").classList.remove("show");
    window.location.href = "index.html";
  }

  function saveNo() {
    document.getElementById("saveModal").classList.remove("show");
    window.location.href = "index.html";
  }

  function loginWithAlislamiah() {
    const currentUserRaw = localStorage.getItem("alislamiah_current_user");
    if (currentUserRaw) {
      window.location.href = "index.html";
    } else {
      window.location.href = "https://mohamedmadoui5195.github.io/Alislamiah-AI/signin.html";
    }
  }

  document.getElementById("loginBtn").addEventListener("click", login);
  document.getElementById("saveYesBtn").addEventListener("click", saveYes);
  document.getElementById("saveNoBtn").addEventListener("click", saveNo);
  document.getElementById("alislamiahBtn").addEventListener("click", loginWithAlislamiah);
  document.getElementById("password").addEventListener("keypress", function(e) {
    if (e.key === "Enter") login();
  });
</script>
</body>
</html>
